<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" width="480" height="480" role="img" aria-label="Siarhei Sheleh — operator ID card">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b101c"/>
      <stop offset="100%" stop-color="#070a12"/>
    </linearGradient>
    <linearGradient id="mono" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="55%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a3e635"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="480" height="480" fill="url(#bg)"/>
  <rect width="480" height="480" fill="url(#grid)"/>
  <rect width="480" height="480" fill="url(#glow)"/>

  <g stroke="url(#mono)" stroke-width="2" fill="none" opacity="0.75" stroke-linecap="square">
    <path d="M28 60 L28 28 L60 28"/>
    <path d="M420 28 L452 28 L452 60"/>
    <path d="M452 420 L452 452 L420 452"/>
    <path d="M60 452 L28 452 L28 420"/>
  </g>

  <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="13" letter-spacing="2.4">
    <text x="52" y="76" fill="#9aa3b2">// OPERATOR</text>
    <text x="428" y="76" text-anchor="end" fill="#5b6577">SVLAB.ONLINE</text>
  </g>

  <g>
    <rect x="168" y="150" width="144" height="144" rx="32" fill="rgba(255,255,255,0.03)" stroke="url(#mono)" stroke-width="1.5"/>
    <text x="240" y="248" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="62" font-weight="600" fill="url(#mono)" letter-spacing="2">SS</text>
  </g>

  <text x="240" y="330" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="13" letter-spacing="1.6" fill="#5b6577">siarhei@svlab ~ % whoami</text>

  <g text-anchor="middle">
    <text x="240" y="380" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="26" font-weight="600" fill="#ffffff" letter-spacing="-0.4">Siarhei Sheleh</text>
    <text x="240" y="406" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13" fill="#9aa3b2">Product entrepreneur · Warsaw, PL</text>
  </g>

  <g transform="translate(178, 424)">
    <rect x="0" y="0" width="124" height="28" rx="8" fill="rgba(52,211,153,0.08)" stroke="rgba(52,211,153,0.3)"/>
    <circle cx="16" cy="14" r="4" fill="#34d399"/>
    <text x="30" y="19" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" letter-spacing="2" fill="#6ee7b7">AVAILABLE</text>
  </g>
</svg>
